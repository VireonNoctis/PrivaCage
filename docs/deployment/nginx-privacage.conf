# PrivaCage Nginx example.
# Replace /srv/privacage/apps/web/dist and TLS settings for the deployment.
# Put the limit_req_zone directive inside the nginx http{} block.

limit_req_zone $binary_remote_addr zone=privacage_api:10m rate=120r/m;

server {
    listen 443 ssl;
    server_name privacage.example;

    root /srv/privacage/apps/web/dist;
    index index.html;

    # Keep API 404 responses from the Rust upstream as JSON; do not convert them
    # to the static website 404 document.
    location ^~ /api/ {
        limit_req zone=privacage_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # This is a single-page application with one real document route.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
