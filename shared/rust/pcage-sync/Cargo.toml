[package]
name = "pcage-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "End-to-end encrypted device-to-device sync protocol core for PrivaCage"

[dependencies]
atomicwrites = "=0.4.4"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
hkdf = "=0.12.4"
pcage-crypto = { path = "../pcage-crypto" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.9.1"
