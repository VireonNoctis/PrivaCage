[package]
name = "pcage-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Portable implementation of the PrivaCage PCAGE01 encrypted profile envelope"

[dependencies]
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"
