[package]
name = "pcage-tracker-intelligence"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
ed25519-dalek = "=2.1.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
