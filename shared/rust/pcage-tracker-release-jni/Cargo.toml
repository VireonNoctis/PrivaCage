[package]
name = "pcage-tracker-release-jni"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Android JNI verifier for signed bundled PrivaCage tracker catalog releases"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
pcage-tracker-intelligence = { path = "../tracker-intelligence" }
serde_json = "=1.0.154"
