name: Validate Windows privacy baseline auditor

on:
  push:
    paths:
      - "windows/pcage-audit/**"
      - ".github/workflows/validate-windows-audit.yml"
      - "README.md"
      - "docs/architecture.md"
      - "docs/security-boundaries.md"
      - "docs/research-notes/windows-privacy-hardening-2026-10-25.md"
  pull_request:
    paths:
      - "windows/pcage-audit/**"
      - ".github/workflows/validate-windows-audit.yml"
      - "README.md"
      - "docs/architecture.md"
      - "docs/security-boundaries.md"
      - "docs/research-notes/windows-privacy-hardening-2026-10-25.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-audit-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows/pcage-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/pcage-audit/go.mod
          cache-dependency-path: windows/pcage-audit/go.mod
      - name: Run tests
        run: go test ./...
      - name: Build executable
        run: go build ./...

  windows-smoke:
    name: Run read-only collector on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/pcage-audit
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/pcage-audit/go.mod
          cache-dependency-path: windows/pcage-audit/go.mod
      - name: Execute audit and validate no-change hardening plans
        run: |
          $reportLines = go run . audit --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = ($reportLines -join [Environment]::NewLine) | ConvertFrom-Json
          if ($report.schema_version -ne 1 -or $report.platform -ne "windows" -or $report.read_only -ne $true -or $report.checks.Count -lt 7) {
            throw "The audit returned unexpected metadata or too few checks."
          }

          $balancedLines = go run . plan --profile balanced --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $balanced = ($balancedLines -join [Environment]::NewLine) | ConvertFrom-Json
          if ($balanced.schema_version -ne 1 -or $balanced.profile -ne "balanced" -or $balanced.changes.Count -lt 1 -or $balanced.block_outbound_by_default -or $balanced.isolate_outbound) {
            throw "The balanced preview did not return an expected, non-disruptive plan."
          }
          if (@($balanced.changes | Where-Object { $_.name -eq "AllowTelemetry" }).Count -ne 1) {
            throw "The balanced plan is missing its edition-aware diagnostic-data control."
          }

          $strictLines = go run . plan --profile strict --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $strict = ($strictLines -join [Environment]::NewLine) | ConvertFrom-Json
          if ($strict.schema_version -ne 1 -or $strict.profile -ne "strict") {
            throw "The strict preview returned unexpected metadata."
          }

          # GitHub's hosted Windows runner may be Windows Server, where client-only App Privacy
          # policies are intentionally skipped. The assertion follows the detected OS edition.
          $isServerEdition = [string]$strict.edition_id -match "Server"
          $locationControl = @($strict.changes | Where-Object { $_.name -eq "LetAppsAccessLocation" -and $_.value -eq 2 }).Count -eq 1
          if ($isServerEdition -and $locationControl) {
            throw "The strict preview unexpectedly applied a client-only App Privacy policy to Windows Server."
          }
          if (-not $isServerEdition -and -not $locationControl) {
            throw "The strict preview omitted the documented Windows-app location denial on a supported client edition."
          }

          $isolationLines = go run . plan --profile balanced --isolate-network --confirm-network-disruption --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $isolation = ($isolationLines -join [Environment]::NewLine) | ConvertFrom-Json
          if (-not $isolation.isolate_outbound -or $isolation.block_outbound_by_default -or @($isolation.warnings).Count -eq 0) {
            throw "The isolation preview did not clearly mark the disruptive network action."
          }
