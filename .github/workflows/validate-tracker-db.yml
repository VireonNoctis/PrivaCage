name: Validate tracker intelligence

on:
  push:
    paths:
      - "shared/tracker-db/**"
      - "shared/scripts/validate-signatures.py"
      - "shared/scripts/tracker-review-report.py"
      - "shared/scripts/validate-android-backup.py"
      - "android-app/app/src/main/AndroidManifest.xml"
      - "tests/**"
      - ".github/workflows/validate-tracker-db.yml"
  pull_request:
    paths:
      - "shared/tracker-db/**"
      - "shared/scripts/validate-signatures.py"
      - "tests/**"
      - ".github/workflows/validate-tracker-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracker database
        run: python shared/scripts/validate-signatures.py --max-age-days 180
      - name: Validate declared Android backup posture
        run: python shared/scripts/validate-android-backup.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Publish tracker evidence freshness report
        run: python shared/scripts/tracker-review-report.py --format markdown >> "$GITHUB_STEP_SUMMARY"
