name: Validate tracker intelligence

on:
  push:
    paths:
      - "shared/tracker-db/**"
      - "shared/go/pcage-tools/**"
      - "android-app/app/src/main/AndroidManifest.xml"
      - "tests/**"
      - ".github/workflows/validate-tracker-db.yml"
  pull_request:
    paths:
      - "shared/tracker-db/**"
      - "shared/go/pcage-tools/**"
      - "tests/**"
      - ".github/workflows/validate-tracker-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: shared/go/pcage-tools/go.mod
      - name: Run Go privacy tool regression tests
        run: go -C shared/go/pcage-tools test ./...
      - name: Validate tracker database and evidence freshness
        run: go -C shared/go/pcage-tools run . validate-tracker --max-age-days 180
      - name: Validate declared Android backup posture
        run: go -C shared/go/pcage-tools run . validate-android-backup
      - name: Validate Android permission and telemetry baseline
        run: go -C shared/go/pcage-tools run . validate-android-privacy
      - name: Publish tracker evidence freshness report
        run: go -C shared/go/pcage-tools run . tracker-report --format markdown >> "$GITHUB_STEP_SUMMARY"
