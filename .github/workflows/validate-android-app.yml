name: Validate Android app and DNS core

on:
  push:
    paths:
      - "android-app/**"
      - "android-core/**"
      - "shared/rust/pcage-sync-jni/**"
      - "shared/rust/pcage-sync/**"
      - "shared/rust/pcage-crypto/**"
      - "shared/rust/pcage-metadata/**"
      - "shared/rust/pcage-metadata-jni/**"
      - "shared/rust/tracker-intelligence/**"
      - "shared/tracker-db/**"
      - "shared/app-alternatives/**"
      - "shared/go/pcage-tools/**"
      - "tests/**"
      - ".github/workflows/validate-android-app.yml"
      - ".github/scripts/prepare-performance-baseline.sh"
      - ".github/scripts/run-performance-comparison.sh"
      - ".github/scripts/compare-performance.py"
      - "docs/performance/**"
  pull_request:
    paths:
      - "android-app/**"
      - "android-core/**"
      - "shared/rust/tracker-intelligence/**"
      - "shared/rust/pcage-sync-jni/**"
      - "shared/rust/pcage-sync/**"
      - "shared/rust/pcage-crypto/**"
      - "shared/rust/pcage-metadata/**"
      - "shared/rust/pcage-metadata-jni/**"
      - "shared/tracker-db/**"
      - "shared/app-alternatives/**"
      - "shared/go/pcage-tools/**"
      - "tests/**"
      - ".github/workflows/validate-android-app.yml"
      - ".github/scripts/prepare-performance-baseline.sh"
      - ".github/scripts/run-performance-comparison.sh"
      - ".github/scripts/compare-performance.py"
      - "docs/performance/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: shared/go/pcage-tools/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy
      - name: Set Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      - name: Install cargo-ndk and Android Rust targets
        run: |
          cargo install cargo-ndk --version 3.5.4 --locked
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Test Rust sync and metadata JNI bridges on the host
        run: |
          cargo test --manifest-path shared/rust/pcage-sync-jni/Cargo.toml
          cargo test --manifest-path shared/rust/pcage-metadata/Cargo.toml
          cargo clippy --manifest-path shared/rust/pcage-metadata/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path shared/rust/pcage-metadata-jni/Cargo.toml
          cargo clippy --manifest-path shared/rust/pcage-metadata-jni/Cargo.toml --all-targets -- -D warnings
      - name: Build Rust sync JNI libraries
        working-directory: shared/rust/pcage-sync-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../../android-app/app/src/main/jniLibs build --release
      - name: Build Rust metadata JNI library
        working-directory: shared/rust/pcage-metadata-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../../android-app/app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Run DNS core unit tests
        working-directory: android-app
        run: gradle --no-daemon :android-core:test
      - name: Run app unit tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Validate Go tooling and Android privacy baseline
        run: |
          go -C shared/go/pcage-tools test ./...
          go -C shared/go/pcage-tools run . validate-android-backup
          go -C shared/go/pcage-tools run . validate-android-privacy
          go -C shared/go/pcage-tools run . validate-tracker --max-age-days 180
          go -C shared/go/pcage-tools run . validate-app-alternatives
      - name: Validate and inspect the bundled tracker catalog
        run: |
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/signatures.json'
          unzip -p android-app/app/build/outputs/apk/debug/app-debug.apk assets/signatures.json > "$RUNNER_TEMP/bundled-signatures.json"
          go -C shared/go/pcage-tools run . validate-tracker --file "$RUNNER_TEMP/bundled-signatures.json"
          unzip -p android-app/app/build/outputs/apk/debug/app-debug.apk assets/catalog.json > "$RUNNER_TEMP/bundled-app-alternatives.json"
          go -C shared/go/pcage-tools run . validate-app-alternatives --file "$RUNNER_TEMP/bundled-app-alternatives.json"

  performance-comparison:
    name: Baseline vs candidate performance measurements
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERFORMANCE_BASELINE_SHA: 7649a85dede79c0decf33426655dc246f9c18cc6
    steps:
      - name: Check out PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Configure isolated performance directories
        run: |
          echo "PERFORMANCE_BASELINE_DIR=$RUNNER_TEMP/privacage-performance-baseline" >> "$GITHUB_ENV"
          echo "PERFORMANCE_RESULTS_DIR=$RUNNER_TEMP/privacage-performance-results" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/privacage-cargo-target" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android and emulator packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk and emulator Rust target
        run: |
          cargo install cargo-ndk --version 3.5.4 --locked
          rustup target add x86_64-linux-android

      - name: Prepare the pre-optimization worktree
        run: bash .github/scripts/prepare-performance-baseline.sh

      - name: Run baseline/candidate benchmarks
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-performance-comparison.sh

      - name: Upload benchmark data and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacage-performance-comparison
          path: ${{ runner.temp }}/privacage-performance-results/
          if-no-files-found: warn
          retention-days: 30
