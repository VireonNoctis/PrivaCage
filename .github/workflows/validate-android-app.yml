name: Validate Android app and DNS core

on:
  push:
    paths:
      - "android-app/**"
      - "android-core/**"
      - "shared/tracker-db/**"
      - "shared/scripts/**"
      - "tests/**"
      - ".github/workflows/validate-android-app.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "android-core/**"
      - "shared/tracker-db/**"
      - "shared/scripts/**"
      - "tests/**"
      - ".github/workflows/validate-android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Run DNS core unit tests
        working-directory: android-app
        run: gradle --no-daemon :android-core:test
      - name: Run APK scanner unit tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Validate Android privacy baseline
        run: |
          python shared/scripts/validate-android-backup.py
          python shared/scripts/validate-android-privacy.py
          python -m unittest discover -s tests -p 'test_android_privacy_baseline.py' -v
      - name: Validate and inspect the bundled tracker catalog
        run: |
          python shared/scripts/validate-signatures.py
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/signatures.json'
          unzip -p android-app/app/build/outputs/apk/debug/app-debug.apk assets/signatures.json | python -m json.tool > /dev/null
