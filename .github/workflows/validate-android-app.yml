name: Validate Android app and DNS core

on:
  push:
    paths:
      - "android-app/**"
      - "android-core/**"
      - "shared/rust/pcage-sync-jni/**"
      - "shared/rust/pcage-sync/**"
      - "shared/rust/pcage-crypto/**"
      - "shared/rust/pcage-metadata/**"
      - "shared/rust/pcage-metadata-jni/**"
      - "shared/rust/pcage-tracker-release-jni/**"
      - "shared/rust/tracker-intelligence/**"
      - "shared/tracker-db/**"
      - "shared/go/pcage-tools/**"
      - "tests/**"
      - ".github/workflows/validate-android-app.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "android-core/**"
      - "shared/rust/pcage-sync-jni/**"
      - "shared/rust/pcage-sync/**"
      - "shared/rust/pcage-crypto/**"
      - "shared/rust/pcage-metadata/**"
      - "shared/rust/pcage-metadata-jni/**"
      - "shared/tracker-db/**"
      - "shared/go/pcage-tools/**"
      - "tests/**"
      - ".github/workflows/validate-android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: shared/go/pcage-tools/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: clippy
      - name: Set Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      - name: Install cargo-ndk and Android Rust targets
        run: |
          cargo install cargo-ndk --version 3.5.4 --locked
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Test Rust sync and metadata JNI bridges on the host
        run: |
          cargo test --manifest-path shared/rust/pcage-sync-jni/Cargo.toml
          cargo test --manifest-path shared/rust/pcage-metadata/Cargo.toml
          cargo clippy --manifest-path shared/rust/pcage-metadata/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path shared/rust/pcage-metadata-jni/Cargo.toml
          cargo clippy --manifest-path shared/rust/pcage-metadata-jni/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path shared/rust/pcage-tracker-release-jni/Cargo.toml
          cargo clippy --manifest-path shared/rust/pcage-tracker-release-jni/Cargo.toml --all-targets -- -D warnings
      - name: Build Rust sync JNI libraries
        working-directory: shared/rust/pcage-sync-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../../android-app/app/src/main/jniLibs build --release
      - name: Build Rust metadata JNI library
        working-directory: shared/rust/pcage-metadata-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../../android-app/app/src/main/jniLibs build --release
      - name: Build Rust tracker release JNI library
        working-directory: shared/rust/pcage-tracker-release-jni
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../../android-app/app/src/main/jniLibs build --release
      - name: Stage signed tracker manifest asset
        run: |
          mkdir -p android-app/app/src/main/assets
          cp shared/tracker-db/signatures.manifest.json android-app/app/src/main/assets/signatures.manifest.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Run DNS core unit tests
        working-directory: android-app
        run: gradle --no-daemon :android-core:test
      - name: Run app unit tests
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Validate Go tooling and Android privacy baseline
        run: |
          go -C shared/go/pcage-tools test ./...
          go -C shared/go/pcage-tools run . validate-android-backup
          go -C shared/go/pcage-tools run . validate-android-privacy
          go -C shared/go/pcage-tools run . validate-tracker --max-age-days 180
      - name: Validate and inspect the bundled tracker catalog
        run: |
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/signatures.json'
          unzip -p android-app/app/build/outputs/apk/debug/app-debug.apk assets/signatures.json > "$RUNNER_TEMP/bundled-signatures.json"
          go -C shared/go/pcage-tools run . validate-tracker --file "$RUNNER_TEMP/bundled-signatures.json"
          unzip -p android-app/app/build/outputs/apk/debug/app-debug.apk assets/signatures.manifest.json > "$RUNNER_TEMP/bundled-signatures.manifest.json"
          cmp shared/tracker-db/signatures.manifest.json "$RUNNER_TEMP/bundled-signatures.manifest.json"
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libpcage_tracker_release_jni.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/armeabi-v7a/libpcage_tracker_release_jni.so'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/x86_64/libpcage_tracker_release_jni.so'
