name: Validate Android DNS policy core

on:
  push:
    paths:
      - "android-core/**"
      - ".github/workflows/validate-android-core.yml"
  pull_request:
    paths:
      - "android-core/**"
      - ".github/workflows/validate-android-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Run unit tests
        working-directory: android-core
        run: gradle test
