name: Repository health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Source and manifest quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Run repository quality checks
        run: python .github/scripts/repository_health.py --quality

  stack:
    name: Generate detected tech stack report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Generate TECH_STACK.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: VireonNoctis/PrivaCage
        run: python .github/scripts/repository_health.py --stack
      - name: Upload the generated report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacage-tech-stack-${{ github.sha }}
          path: TECH_STACK.md
          if-no-files-found: error
          retention-days: 30
